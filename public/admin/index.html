<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — School Booking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.09);
    }
    .logo { font-size: 2rem; text-align: center; margin-bottom: 0.5rem; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 0.3rem; color: #1a1a2e; }
    .sub { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 2rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: #333; }
    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 9px;
      font-size: 0.92rem;
      margin-bottom: 1.1rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #1a1a2e; }
    .btn {
      width: 100%;
      padding: 0.7rem;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .back { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; }
    .back a { color: #5b21b6; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <h1>Admin Login</h1>
    <p class="sub">School Booking System</p>

    <div class="error" id="error-msg"></div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@school.com" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <button class="btn" id="login-btn" onclick="login()">Sign In</button>

    <div class="back"><a href="/">← Back to student page</a></div>
  </div>

<script>
  // Redirect if already logged in (only when auth is active)
  // if (localStorage.getItem('token')) {
  //   window.location.href = '/admin/dashboard.html';
  // }

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const errEl    = document.getElementById('error-msg');

    errEl.style.display = 'none';
    if (!email || !password) { showError('Please fill in all fields.'); return; }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const json = await res.json();

      if (res.ok && json.data?.token) {
        localStorage.setItem('token', json.data.token);
        localStorage.setItem('user', JSON.stringify(json.data.user));
        window.location.href = '/admin/dashboard.html';
      } else {
        showError(json.message || 'Login failed.');
      }
    } catch {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
